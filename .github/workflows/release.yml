name: Flatpak Build & Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            python3-pip

      - name: Configurar repositorios Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Sdk//49 org.gnome.Platform//49

      - name: Descargar wheels Python para Flatpak
        run: |
          mkdir -p flatpak-deps
          python3 -m pip download \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --python-version 313 \
            --implementation cp \
            --dest flatpak-deps \
            requests urllib3 certifi charset-normalizer idna setuptools

      - name: Construir Flatpak
        run: |
          flatpak-builder \
            --user \
            --install-deps-from=flathub \
            --force-clean \
            --repo=flatpak-repo \
            build-dir \
            com.meteowatch.app.json

      - name: Crear bundle .flatpak
        run: |
          flatpak build-bundle \
            flatpak-repo \
            meteowatch.flatpak \
            com.meteowatch.app \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Crear .flatpakref
        run: |
          cat > meteowatch.flatpakref << 'EOF'
          [Flatpak Ref]
          Name=com.meteowatch.app
          Title=Meteowatch
          Url=https://github.com/vladzur/meteowatch/releases/latest/download/meteowatch.flatpak
          RuntimeRepo=https://flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          EOF

      - name: Subir assets al Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            meteowatch.flatpak
            meteowatch.flatpakref
