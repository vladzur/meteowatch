<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Fondo circular -->
  <circle cx="64" cy="64" r="60" fill="#3584e4" />
  <circle cx="64" cy="64" r="56" fill="none" stroke="#1a5fb4" stroke-width="2" />

  <!-- Sol -->
  <circle cx="46" cy="50" r="22" fill="#f5c211" />
  <circle cx="46" cy="50" r="22" fill="none" stroke="#e5a50a" stroke-width="1.5" />

  <!-- Rayos del sol -->
  <g stroke="#f5c211" stroke-width="3" stroke-linecap="round">
    <line x1="46" y1="22" x2="46" y2="16" />
    <line x1="46" y1="78" x2="46" y2="84" />
    <line x1="20" y1="50" x2="14" y2="50" />
    <line x1="72" y1="50" x2="78" y2="50" />
    <line x1="28" y1="32" x2="23" y2="27" />
    <line x1="64" y1="68" x2="69" y2="73" />
    <line x1="64" y1="32" x2="69" y2="27" />
    <line x1="28" y1="68" x2="23" y2="73" />
  </g>

  <!-- Nube (superpuesta al sol) -->
  <g fill="#ffffff">
    <circle cx="68" cy="62" r="16" />
    <circle cx="82" cy="58" r="14" />
    <circle cx="80" cy="68" r="12" />
    <circle cx="92" cy="64" r="10" />
    <circle cx="60" cy="66" r="11" />
  </g>
  <!-- Base plana de la nube -->
  <rect x="48" y="68" width="52" height="16" rx="4" fill="#ffffff" />

  <!-- Gotas de lluvia -->
  <g fill="#62a0ea">
    <ellipse cx="93" cy="82" rx="2.5" ry="4" />
    <ellipse cx="85" cy="88" rx="2" ry="3.5" />
    <ellipse cx="76" cy="84" rx="2.5" ry="4" />
    <ellipse cx="68" cy="90" rx="2" ry="3" />
    <ellipse cx="80" cy="94" rx="1.5" ry="2.5" />
  </g>
</svg>
